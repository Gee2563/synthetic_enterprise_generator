[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-enterprise"
version = "0.1.0"
description = "Synthetic enterprise data generation scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Faker>=24.0.0",
    "pandas>=2.2.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0,<6.120.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.11.0,<0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
